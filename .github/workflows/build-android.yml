
name: Build MARSA-Lab Android Release

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "android/**"
      - ".github/workflows/build-android.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: android

    steps:
      - name: Ambil kode sumber
        uses: actions/checkout@v4

      - name: Pasang JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Pasang Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Siapkan keystore
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > app/marsa-lab-release.jks
          test -s app/marsa-lab-release.jks
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}

      - name: Build APK Release Signed
        run: gradle assembleRelease --no-daemon
        env:
          KEYSTORE_FILE: marsa-lab-release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Unggah APK Release Signed
        uses: actions/upload-artifact@v4
        with:
          name: MarsaLab-Android-Release-Signed
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Hapus keystore sementara
        if: always()
        run: rm -f app/marsa-lab-release.jks
